<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div id="pai">
    <p id="paraRemover">Me remova!</p>
  </div>
  <script>
    let pai = document.getElementById('pai')
    let paragrafo = document.getElementById('paraRemover')
    pai.removeChild(paragrafo)
  </script>
</body>
</html>
