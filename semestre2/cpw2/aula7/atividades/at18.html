<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <button id="alertaBtn">Mostrar Alerta</button>
  <script>
    let botao = document.getElementById('alertaBtn')
    function alerta() {
      return alert("Botão clicado")
    }
    botao.addEventListener('click', alerta)
    
  </script>
</body>
</html>
