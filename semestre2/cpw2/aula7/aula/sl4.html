<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <ul id="listaCompras">
    <li>Maça</li>
  </ul>
  <script>
    const lista = document.getElementById('listaCompras')
    const novoItem = document.createElement('li')
    novoItem.textContent = 'Banana'
    lista.appendChild(novoItem) // Adiciona Banana ao final da lista
  </script>
</body>
</html>
